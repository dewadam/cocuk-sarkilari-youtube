name: Draft song captions (human review required)

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: "Altyazı taslağı üretilecek şarkı kimliği (ör. TR001)"
        required: true
        type: string
      model:
        description: "Whisper modeli (small daha kaliteli, tiny daha hızlı)"
        required: true
        default: small
        type: choice
        options:
          - tiny
          - base
          - small
          - medium

permissions:
  contents: read

jobs:
  draft-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install caption transcription dependency
        run: python -m pip install --upgrade faster-whisper

      - name: Generate draft captions
        env:
          SONG_ID: ${{ inputs.song_id }}
          MODEL: ${{ inputs.model }}
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          if [ -z "$SONG_FOLDER" ]; then
            echo "Şarkı klasörü bulunamadı: $SONG_ID"
            exit 1
          fi
          AUDIO_FILE="$(python -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); m=json.loads((p/"metadata.json").read_text(encoding="utf-8")); print(m.get("audio_file", "song.mp3"))' "$SONG_FOLDER")"
          if [ ! -f "$SONG_FOLDER/$AUDIO_FILE" ]; then
            echo "Ses dosyası bulunamadı: $SONG_FOLDER/$AUDIO_FILE"
            exit 1
          fi
          mkdir -p output
          python app/transcribe_lyrics.py \
            --audio "$SONG_FOLDER/$AUDIO_FILE" \
            --output-srt "output/${SONG_ID}_captions_draft.srt" \
            --report "output/${SONG_ID}_captions-draft-report.json" \
            --model "$MODEL"

      - name: Upload draft only (not copied into song package)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-captions-draft
          path: |
            output/${{ inputs.song_id }}_captions_draft.srt
            output/${{ inputs.song_id }}_captions-draft-report.json
          if-no-files-found: error
          retention-days: 14
