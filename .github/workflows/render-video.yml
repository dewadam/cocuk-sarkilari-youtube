name: Render vertical song video

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: "Render edilecek hazır şarkı kimliği (ör. TR001)"
        required: true
        type: string
      publish_to_youtube:
        description: "QC başarılıysa YouTube'a herkese açık yükle (metadata status=ready ve OAuth secret gerekir)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate scene assets and captions
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          if [ -z "$SONG_FOLDER" ]; then
            echo "Şarkı klasörü bulunamadı: $SONG_ID"
            exit 1
          fi
          python app/validate_assets.py \
            --song-folder "$SONG_FOLDER" \
            --report "output/${SONG_ID}_asset-preflight-report.json"

      - name: Render preview MP4
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: python app/render_video.py --song-id "$SONG_ID"

      - name: Validate rendered MP4
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          python app/validate_render.py \
            --input "output/${SONG_ID}_preview.mp4" \
            --report "output/${SONG_ID}_qc-report.json"

      - name: Upload preview and QC report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-video-preview
          path: |
            output/${{ inputs.song_id }}_preview.mp4
            output/${{ inputs.song_id }}_qc-report.json
            output/${{ inputs.song_id }}_asset-preflight-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Install YouTube upload dependencies
        if: ${{ inputs.publish_to_youtube }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Confirm release approval
        if: ${{ inputs.publish_to_youtube }}
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          echo "SONG_FOLDER=$SONG_FOLDER" >> "$GITHUB_ENV"
          python -c "import json,os,sys; p=os.path.join(os.environ['SONG_FOLDER'],'metadata.json'); d=json.load(open(p,encoding='utf-8')); print('Release status:',d.get('status')); sys.exit(0 if d.get('status')=='ready' else 1)"

      - name: Upload QC-passed video to YouTube
        if: ${{ inputs.publish_to_youtube }}
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_VIDEO_PATH: output/${{ inputs.song_id }}_preview.mp4
          SONG_ID: ${{ inputs.song_id }}
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_TAGS: çocuk şarkıları, Türkçe çocuk şarkıları, okul öncesi, çocuk müziği
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          export YOUTUBE_METADATA_PATH="$SONG_FOLDER/metadata.json"
          python app/upload_youtube.py

      - name: Upload YouTube result record
        if: ${{ always() && inputs.publish_to_youtube && hashFiles('output/youtube-upload-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-youtube-upload-result
          path: output/youtube-upload-result.json
          retention-days: 90
