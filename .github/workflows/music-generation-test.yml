name: Music generation test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate one short test track
        env:
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
        run: python scripts/generate_music_test.py

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkce-cocuk-sarkisi-muzik-testi
          path: output/TR001/
          if-no-files-found: warn
          retention-days: 7
