name: Project validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate: yapılandırmayı kontrol et; dry-run: örnek planı göster"
        required: true
        type: choice
        options:
          - validate
          - dry-run
        default: validate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration and topic backlog
        run: python app/main.py --mode "${{ inputs.mode }}"

      - name: Validate reusable animation catalog
        run: python app/animation_catalog.py validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
