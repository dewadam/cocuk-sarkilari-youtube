name: Azure AI scene image test

on:
  workflow_dispatch:
    inputs:
      image_count:
        description: "Üretilecek görsel sayısı (1-8; ilk doğrulama için 1 seç)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "8"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate bounded Azure FLUX images
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_IMAGE_MODEL: ${{ vars.AZURE_IMAGE_MODEL }}
          AZURE_IMAGE_COUNT: ${{ inputs.image_count }}
          AZURE_IMAGE_SIZE: "1024x1024"
        run: python3 app/generate_azure_scene_images.py

      - name: Upload generated images and manifest even after timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-ai-scene-test
          path: output/azure-scene-test/
          if-no-files-found: error
          retention-days: 14
