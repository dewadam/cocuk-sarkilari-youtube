name: Produce song video preview (no Azure)

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: "Şarkı kimliği (ör. TR001)"
        required: true
        default: "TR001"
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"

      - name: Generate free procedural animation loop (no Azure)
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: python app/generate_procedural_dance_loop.py

      - name: Render vertical MP4 preview
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: python app/render_video.py --song-id "$SONG_ID"

      - name: Validate rendered MP4
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: python app/validate_render.py --input "output/${SONG_ID}_preview.mp4" --report "output/${SONG_ID}_qc-report.json"

      - name: Upload video, scene images, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-production-preview
          path: |
            output/${{ inputs.song_id }}_preview.mp4
            output/${{ inputs.song_id }}_qc-report.json
            output/${{ inputs.song_id }}_asset-preflight-report.json
            output/${{ inputs.song_id }}_visual-generation-manifest.json
            songs/${{ inputs.song_id }}_*/visuals/*
          if-no-files-found: warn
          retention-days: 14
