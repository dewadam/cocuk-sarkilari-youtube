name: Generate seamless dance video and publish song

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: "Üretilecek şarkı kimliği (ör. TR002)"
        required: true
        default: "TR002"
        type: string
      publish_to_youtube:
        description: "Yalnızca metadata status=ready ise QC sonrası YouTube'a yükle"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate selected song audio and metadata
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          song_id = os.environ["SONG_ID"]
          matches = list(Path("songs").glob(f"{song_id}_*"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one song folder for {song_id}; found {len(matches)}")
          folder = matches[0]
          metadata = json.loads((folder / "metadata.json").read_text(encoding="utf-8"))
          audio = folder / metadata.get("audio_file", "song.mp3")
          if not audio.is_file():
              raise SystemExit(f"Missing song audio: {audio}")
          print(f"Song: {metadata.get('title', song_id)}")
          print(f"Audio: {audio} ({audio.stat().st_size} bytes)")
          print(f"Release status: {metadata.get('status')}")
          PY

      - name: Generate real AI 3D animation on Azure GPU
        env:
          SONG_ID: ${{ inputs.song_id }}
          AZURE_VIDEO_WORKER_URL: ${{ secrets.AZURE_VIDEO_WORKER_URL }}
          AZURE_VIDEO_WORKER_TOKEN: ${{ secrets.AZURE_VIDEO_WORKER_TOKEN }}
          AZURE_VIDEO_MODEL: ${{ vars.AZURE_VIDEO_MODEL }}
        run: python app/generate_azure_video_worker.py --song-id "$SONG_ID" --seconds 30 --timeout-minutes 100

      - name: Render loop to full song length
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: python app/render_video.py --song-id "$SONG_ID" --output "output/${SONG_ID}_preview.mp4"

      - name: Validate rendered video
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          python app/validate_render.py \
            --input "output/${SONG_ID}_preview.mp4" \
            --report "output/${SONG_ID}_qc-report.json"

      - name: Upload final video and reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-dance-video-preview
          path: |
            output/${{ inputs.song_id }}_preview.mp4
            output/${{ inputs.song_id }}_qc-report.json
            songs/${{ inputs.song_id }}_*/visuals/dance_loop.mp4
            songs/${{ inputs.song_id }}_*/visuals/dance_loop_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install YouTube upload dependencies
        if: ${{ inputs.publish_to_youtube }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Confirm publication approval
        if: ${{ inputs.publish_to_youtube }}
        env:
          SONG_ID: ${{ inputs.song_id }}
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          echo "SONG_FOLDER=$SONG_FOLDER" >> "$GITHUB_ENV"
          python -c "import json,os,sys; p=os.path.join(os.environ['SONG_FOLDER'],'metadata.json'); d=json.load(open(p,encoding='utf-8')); print('Release status:',d.get('status')); sys.exit(0 if d.get('status')=='ready' else 1)"

      - name: Upload QC-passed video to YouTube
        if: ${{ inputs.publish_to_youtube }}
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_VIDEO_PATH: output/${{ inputs.song_id }}_preview.mp4
          SONG_ID: ${{ inputs.song_id }}
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_TAGS: çocuk şarkıları, Türkçe çocuk şarkıları, okul öncesi, çocuk müziği, hayvan sesleri
        run: |
          SONG_FOLDER="$(find songs -maxdepth 1 -type d -name "${SONG_ID}_*" -print -quit)"
          export YOUTUBE_METADATA_PATH="$SONG_FOLDER/metadata.json"
          python app/upload_youtube.py

      - name: Save YouTube upload result
        if: ${{ always() && inputs.publish_to_youtube && hashFiles('output/youtube-upload-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.song_id }}-youtube-upload-result
          path: output/youtube-upload-result.json
          retention-days: 90
