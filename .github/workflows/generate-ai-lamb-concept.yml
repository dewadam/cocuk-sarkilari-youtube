name: Generate free AI lamb concept

on:
  workflow_dispatch:
  push:
    paths:
      - "app/generate_ai_lamb_concept.py"
      - ".github/workflows/generate-ai-lamb-concept.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate one concept image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 app/generate_ai_lamb_concept.py

      - name: Upload image and prompt
        uses: actions/upload-artifact@v4
        with:
          name: AI-lamb-concept
          path: output/
          if-no-files-found: error
          retention-days: 14
